<!DOCTYPE html>
<html foxified="" lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Streaming HLS</title>

<!-- Scripts do HLS.js para compatibilidade com Androide e Pcs -->
<script src="https://jsdelivr.net"></script>
<style>
    body {
        margin: 0;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #fff;
        font-family: sans-serif;
    }

    .container {
        width: 100%;
        max-width: 800px;
        padding: 10px;
    }

    video {
        width: 100%;
        border-radius: 8px;padding: 0 4px;
    }
</style>
</head>
<body>

<div class="container">

<video 
id="video"
class="video-js vjs-default-skin vjs-big-play-centered"
controls
preload="auto"
width="640"
height="360"
data-setup='()'
 autoplay
 muted
 playsinline
 name="media">
</video>
</div>
<!-- COLOQUE SEU LINK M3U8 NO LINK ABAIXO -->
<script>
    //INSIRA SEU LINKDE IP AQUI DENTRO DAS ASPAS
    const streamURL = "http://192.168.1.209:8080/hls/stream.m3u8";

    const video = document.getElementById("videp");

    if (hls.isSupported()) {
        const hls = new HLS();
        hls.loadSource(streamURL);
        hls.attachMedia(video);
    }
    //Suport nativo para Safari (iphone, ipads, Mac)
    else if (video.canPlayType('application/vnd.apple.mpefurl')) {
        video.src = streamURL;
    }
</script>


</script>

</body>
</html>
