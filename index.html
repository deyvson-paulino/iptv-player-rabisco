<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <title>Meu IPTV Player</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>▶ Meu IPTV Player</h1>

</header>

<main>

        <video
            id="video"
            poster="https://staying-finish-mai-shift.trycloudflare.com/imgagens/screen-logol-TV RABISCO.png"
            src="https://staying-finish-mai-shift.trycloudflare.com/videos/filme1.mp4"
            controls
            autoplay
            playsinline
        ></video>

        <h2 id="titulo">Selecione um canal</h2>

    </section>

    <aside>

        <h2>Lista de canais M3U</h2>

        <input
            type="text"
            id="busca"
            placeholder="Buscar canal..."
        >

        <div id="lista"></div>

    </aside>

</main>

<script src="player.js"></script>

</body>
</html>
